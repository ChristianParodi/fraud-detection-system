[project]
name = "fraud-detection-system"
version = "0.1.0"
description = "A fraud detection ML system"
readme = "README.md"
authors = [
    { name = "Christian", email = "christian.parodi19@gmail.it" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "lightgbm",
    "imbalanced-learn",
    "jupyter",
    "kagglehub>=1.0.2",
]

[project.optional-dependencies]
# GPU notebooks under notebooks/cuml/ — RAPIDS packages, not on plain PyPI.
# Install with: uv sync --extra cuml --extra-index-url https://pypi.nvidia.com
cuml = [
    "cudf-cu12",
    "cuml-cu12",
]

[tool.uv]
package = false

[tool.ruff.format]
indent-style = "tab"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
