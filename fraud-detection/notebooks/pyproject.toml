[project]
name = "fraud-detection-notebooks"
version = "0.1.0"
description = "Environment for the exploration/tuning notebooks in notebooks/"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "lightgbm",
    "imbalanced-learn",
    "jupyter",
]

[project.optional-dependencies]
# GPU notebooks under notebooks/cuml/ — RAPIDS packages, not on plain PyPI.
# Install with: uv sync --extra cuml --extra-index-url https://pypi.nvidia.com
cuml = [
    "cudf-cu12",
    "cuml-cu12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
